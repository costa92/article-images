<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180"><defs><marker id="h-9AA4C0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA4C0"/></marker><marker id="h-F87171" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker><marker id="h-22D3EE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker><marker id="h-FBBF24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker><marker id="h-34D399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker><marker id="h-A78BFA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker><marker id="h-E8ECF8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8ECF8"/></marker></defs><rect width="100%" height="100%" fill="#0B0E17"/><text x="800" y="70.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="40" font-weight="600" fill="#E8ECF8" text-anchor="middle">部署流程：确认源站已换新，再清边缘缓存</text><rect x="230" y="130" width="660" height="110" rx="18" fill="#141A2B" stroke="#22D3EE" stroke-width="2"/><text x="560" y="178.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="600" fill="#E8ECF8" text-anchor="middle">推送到 master</text><text x="560" y="218.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="22" font-weight="400" fill="#9AA4C0" text-anchor="middle">GitHub Actions 触发</text><rect x="230" y="290" width="660" height="110" rx="18" fill="#141A2B" stroke="#22D3EE" stroke-width="2"/><text x="560" y="338.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="600" fill="#E8ECF8" text-anchor="middle">构建：npm run build</text><text x="560" y="378.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="22" font-weight="400" fill="#9AA4C0" text-anchor="middle">生成 public/，含随机 build-id.txt</text><rect x="230" y="450" width="660" height="110" rx="18" fill="#141A2B" stroke="#A78BFA" stroke-width="2"/><text x="560" y="498.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="600" fill="#E8ECF8" text-anchor="middle">推送 public/ 到 Pages 仓库</text><text x="560" y="538.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="22" font-weight="400" fill="#9AA4C0" text-anchor="middle">peaceiris/actions-gh-pages</text><path d="M560,240 L560,285" fill="none" stroke="#9AA4C0" stroke-width="3" stroke-linejoin="round" marker-end="url(#h-9AA4C0)"/><path d="M560,400 L560,445" fill="none" stroke="#9AA4C0" stroke-width="3" stroke-linejoin="round" marker-end="url(#h-9AA4C0)"/><path d="M560,560 L560,605" fill="none" stroke="#9AA4C0" stroke-width="3" stroke-linejoin="round" marker-end="url(#h-9AA4C0)"/><polygon points="560,605 860,700 560,795 260,700" fill="#2A2410" stroke="#FBBF24" stroke-width="3"/><text x="560" y="690.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#FBBF24" text-anchor="middle">线上 build-id.txt</text><text x="560" y="732.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#FBBF24" text-anchor="middle">等于本次编号？</text><path d="M781,675 L1060,675" fill="none" stroke="#F87171" stroke-width="3" stroke-linejoin="round" marker-end="url(#h-F87171)"/><text x="800" y="660.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="600" fill="#F87171" text-anchor="middle">否</text><path d="M1060,725 L781,725" fill="none" stroke="#F87171" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#h-F87171)"/><text x="800" y="762.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#F87171" text-anchor="middle">10 秒后再查</text><rect x="1060" y="610" width="470" height="180" rx="18" fill="#2A1620" stroke="#F87171" stroke-width="2"/><text x="1295" y="662.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="600" fill="#F87171" text-anchor="middle">Pages 还在发布，等待</text><text x="1295" y="704.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="22" font-weight="400" fill="#9AA4C0" text-anchor="middle">?nc=随机数 绕过边缘缓存</text><text x="1295" y="748.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#F87171" text-anchor="middle">超过 10 分钟 → 任务失败</text><path d="M560,795 L560,850" fill="none" stroke="#34D399" stroke-width="3" stroke-linejoin="round" marker-end="url(#h-34D399)"/><text x="580" y="830.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="600" fill="#34D399" text-anchor="start">是</text><rect x="230" y="855" width="660" height="110" rx="18" fill="#141A2B" stroke="#34D399" stroke-width="2"/><text x="560" y="903.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="600" fill="#E8ECF8" text-anchor="middle">调用 purge_cache 清除全部缓存</text><text x="560" y="943.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#9AA4C0" text-anchor="middle">Token 只有「清除缓存」权限</text><path d="M560,965 L560,1010" fill="none" stroke="#34D399" stroke-width="3" stroke-linejoin="round" marker-end="url(#h-34D399)"/><rect x="230" y="1015" width="660" height="110" rx="18" fill="#0F2A22" stroke="#34D399" stroke-width="2"/><text x="560" y="1063.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="600" fill="#34D399" text-anchor="middle">下一个访客回源，拿到新页面</text><text x="560" y="1103.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#9AA4C0" text-anchor="middle">再缓存 1 天</text><rect x="1060" y="880" width="470" height="190" rx="18" fill="#0F1423" stroke="#2A3352" stroke-width="2"/><text x="1090" y="930.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="600" fill="#E8ECF8" text-anchor="start">实测一次部署：</text><text x="1090" y="975.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#9AA4C0" text-anchor="start">7 次读到 404（还没上线）</text><text x="1090" y="1015.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#9AA4C0" text-anchor="start">约 70 秒后编号对上</text><text x="1090" y="1055.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#9AA4C0" text-anchor="start">随即清缓存成功</text></svg>
