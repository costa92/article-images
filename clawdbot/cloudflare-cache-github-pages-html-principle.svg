mily="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="600" fill="#22D3EE" text-anchor="middle">Cloudflare 边缘节点</text><rect x="1120" y="150" width="420" height="560" rx="18" fill="#141A2B" stroke="#A78BFA" stroke-width="3"/><text x="1330" y="210.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="600" fill="#A78BFA" text-anchor="middle">GitHub Pages 源站</text><text x="270" y="290.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="400" fill="#E8ECF8" text-anchor="middle">本地缓存的 HTML</text><text x="270" y="340.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="22" font-weight="400" fill="#9AA4C0" text-anchor="middle">cache-control: max-age=600</text><text x="270" y="410.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#9AA4C0" text-anchor="middle">只要没过期，</text><text x="270" y="445.1" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#9AA4C0" text-anchor="middle">连请求都不发</text><rect x="100" y="530" width="340" height="120" rx="18" fill="#2A1620" stroke="#F87171" stroke-width="2" stroke-dasharray="8 6"/><text x="270" y="580.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="600" fill="#F87171" text-anchor="middle">Cloudflare 清缓存</text><text x="270" y="620.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#F87171" text-anchor="middle">管不到这里</text><rect x="610" y="260" width="360" height="85" rx="12" fill="#10172A" stroke="#9AA4C0" stroke-width="2"/><text x="630" y="296.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#E8ECF8" text-anchor="start">① CSS/JS 带 ?v=</text><text x="630" y="330.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#9AA4C0" text-anchor="start">边缘 TTL 1 年</text><rect x="610" y="365" width="360" height="85" rx="12" fill="#10172A" stroke="#9AA4C0" stroke-width="2"/><text x="630" y="401.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#E8ECF8" text-anchor="start">② /images/、/medias/</text><text x="630" y="435.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#9AA4C0" text-anchor="start">边缘 TTL 7 天</text><rect x="610" y="470" width="360" height="85" rx="12" fill="#10172A" stroke="#22D3EE" stroke-width="2"/><text x="630" y="506.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#E8ECF8" text-anchor="start">③ 以 / 结尾或 html/xml/json</text><text x="630" y="540.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="400" fill="#22D3EE" text-anchor="start">边缘 TTL 1 天</text><rect x="610" y="590" width="360" height="90" rx="12" fill="#2A2410" stroke="#FBBF24" stroke-width="2"/><text x="790" y="628.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="26" font-weight="600" fill="#FBBF24" text-anchor="middle">部署后 purge_cache</text><text x="790" y="662.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#FBBF24" text-anchor="middle">只清这一层</text><text x="1330" y="290.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="400" fill="#E8ECF8" text-anchor="middle">public/ 静态文件</text><text x="1330" y="340.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#9AA4C0" text-anchor="middle">推送后异步发布</text><text x="1330" y="390.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#9AA4C0" text-anchor="middle">约 1 分钟后才换新</text><text x="1330" y="470.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="26" font-weight="400" fill="#A78BFA" text-anchor="middle">/build-id.txt</text><text x="1330" y="512.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="400" fill="#9AA4C0" text-anchor="middle">每次构建一个新编号</text><path d="M480,670 L570,670" fill="none" stroke="#34D399" stroke-width="3" stroke-linejoin="round" marker-end="url(#h-34D399)"/><path d="M1000,670 L1110,670" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linejoin="round" marker-end="url(#h-22D3EE)"/><text x="530" y="645.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#34D399" text-anchor="middle">请求</text><text x="1060" y="620.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#22D3EE" text-anchor="middle">未命中</text><text x="1060" y="647.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="400" fill="#22D3EE" text-anchor="middle">回源</text><rect x="60" y="760" width="1480" height="170" rx="18" fill="#0F1423" stroke="#2A3352" stroke-width="2"/><text x="100" y="815.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#E8ECF8" text-anchor="start">规则里不显式设置浏览器 TTL：可缓存的响应会被区域默认值改成 max-age=14400（4 小时）</text><text x="100" y="870.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="400" fill="#22D3EE" text-anchor="start">→ 浏览器 TTL 选「接受源服务器 TTL」，保持 600 秒；边缘 TTL 设 1 天，由部署流程负责清</text></svg>
