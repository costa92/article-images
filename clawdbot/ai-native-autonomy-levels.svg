<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fbfb0"/></marker>
    <marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5736b"/></marker>
  </defs>
  <rect width="800" height="600" fill="#0f1b2d"/>
  <text x="400" y="42" text-anchor="middle" fill="#e6edf5" font-size="19" font-weight="700">AI 权限分级：按数据晋级，出错就降级</text>
  <text x="250" y="72" text-anchor="middle" fill="#8fa3bb" font-size="13">级别：AI 能做什么</text>
  <text x="600" y="72" text-anchor="middle" fill="#8fa3bb" font-size="13">进入这一级的条件</text>

  <!-- 降级箭头 -->
  <line x1="48" y1="100" x2="48" y2="520" stroke="#e5736b" stroke-width="2.5" marker-end="url(#dn)"/>
  <text x="34" y="310" text-anchor="middle" fill="#e5736b" font-size="13" transform="rotate(-90 34 310)">出现一次有害建议 → 立即降一级</text>

  <!-- L5 -->
  <rect x="80" y="88" width="340" height="52" rx="10" fill="#161f2e" stroke="#4a5568" stroke-dasharray="5 4"/>
  <text x="100" y="120" fill="#9aa8b8" font-size="15" font-weight="700">L5 白名单全自动</text>
  <text x="404" y="120" text-anchor="end" fill="#7d8a9b" font-size="12.5">极窄场景，事后通知</text>
  <text x="440" y="110" fill="#9aa8b8" font-size="12.5">该场景故障实验准确率 ≥ 99%，能自动回退</text>
  <text x="440" y="129" fill="#9aa8b8" font-size="12.5">永远只覆盖极窄的白名单</text>

  <!-- L4 -->
  <rect x="80" y="158" width="340" height="52" rx="10" fill="#161f2e" stroke="#4a5568" stroke-dasharray="5 4"/>
  <text x="100" y="190" fill="#9aa8b8" font-size="15" font-weight="700">L4 批准后执行</text>
  <text x="404" y="190" text-anchor="end" fill="#7d8a9b" font-size="12.5">人批准，AI 执行并验证</text>
  <text x="440" y="180" fill="#9aa8b8" font-size="12.5">L3 审批人实际推翻过 ≥ 2 次；</text>
  <text x="440" y="199" fill="#9aa8b8" font-size="12.5">Kill Switch、自动回退、验证闭环就绪</text>

  <!-- L3 终点 -->
  <rect x="80" y="228" width="340" height="52" rx="10" fill="#3a2e14" stroke="#f5b041" stroke-width="2"/>
  <text x="100" y="260" fill="#f5b041" font-size="15" font-weight="700">L3 提 PR</text>
  <text x="404" y="260" text-anchor="end" fill="#f3d39a" font-size="12.5">本项目终点</text>
  <text x="440" y="250" fill="#e6edf5" font-size="12.5">根因准确率 ≥ 80%，有害建议 = 0</text>
  <text x="440" y="269" fill="#b8c6d6" font-size="12.5">连续 10 次真实故障结论未被推翻</text>

  <!-- L2 -->
  <rect x="80" y="298" width="340" height="52" rx="10" fill="#1c2f4a" stroke="#3b5a7a"/>
  <text x="100" y="330" fill="#e6edf5" font-size="15" font-weight="700">L2 建议</text>
  <text x="404" y="330" text-anchor="end" fill="#b8c6d6" font-size="12.5">给根因和处置，人执行</text>
  <text x="440" y="329" fill="#e6edf5" font-size="12.5">评估集上异常识别准确率 ≥ 90%</text>

  <!-- L1 -->
  <rect x="80" y="368" width="340" height="52" rx="10" fill="#1c2f4a" stroke="#3b5a7a"/>
  <text x="100" y="400" fill="#e6edf5" font-size="15" font-weight="700">L1 诊断</text>
  <text x="404" y="400" text-anchor="end" fill="#b8c6d6" font-size="12.5">关联信号，指出哪里不对</text>
  <text x="440" y="399" fill="#e6edf5" font-size="12.5">L0 稳定运行，没有隐私数据泄漏</text>

  <!-- L0 -->
  <rect x="80" y="438" width="340" height="52" rx="10" fill="#1c2f4a" stroke="#3b5a7a"/>
  <text x="100" y="470" fill="#e6edf5" font-size="15" font-weight="700">L0 只读</text>
  <text x="404" y="470" text-anchor="end" fill="#b8c6d6" font-size="12.5">查询状态</text>
  <text x="440" y="469" fill="#8fa3bb" font-size="12.5">起点</text>

  <!-- 晋级箭头 -->
  <line x1="250" y1="438" x2="250" y2="422" stroke="#3fbfb0" stroke-width="2" marker-end="url(#up)"/>
  <line x1="250" y1="368" x2="250" y2="352" stroke="#3fbfb0" stroke-width="2" marker-end="url(#up)"/>
  <line x1="250" y1="298" x2="250" y2="282" stroke="#3fbfb0" stroke-width="2" marker-end="url(#up)"/>
  <line x1="250" y1="228" x2="250" y2="212" stroke="#4a5568" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="250" y1="158" x2="250" y2="142" stroke="#4a5568" stroke-width="2" stroke-dasharray="3 3"/>

  <rect x="80" y="520" width="688" height="56" rx="10" fill="#13233a" stroke="#2a3f5c"/>
  <text x="424" y="544" text-anchor="middle" fill="#e6edf5" font-size="13.5">不跳级，每级至少稳定运行一个月　·　降级比升级容易</text>
  <text x="424" y="565" text-anchor="middle" fill="#8fa3bb" font-size="12.5">依据：每次调用的审计记录，以及人采纳或推翻 AI 结论的次数</text>
</svg>
