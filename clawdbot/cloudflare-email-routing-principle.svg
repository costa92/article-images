<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1240" viewBox="0 0 900 1240"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8b9ab6"/></marker></defs><rect width="900" height="1240" fill="#0c111d"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="48" y="68" font-size="40" fill="#e9edf7" font-weight="700">一封 Claude 邮件怎样到达 Gmail</text><text x="48" y="111" font-size="25" fill="#aab6cd" font-weight="400">原理示意 · 邮箱地址均为示例</text><rect x="48" y="150" width="804" height="150" rx="18" fill="#151c2b" stroke="#a7b6ff" stroke-width="2"/><text x="78" y="198" font-size="34" fill="#a7b6ff" font-weight="700">01  Claude / Anthropic 发信服务</text><text x="78" y="244" font-size="27" fill="#e9edf7" font-weight="400">收件地址：claude@example.com</text><text x="78" y="286" font-size="27" fill="#e9edf7" font-weight="400">查询 example.com 的 MX，找到接收服务器</text><path d="M450 300 V365" stroke="#8b9ab6" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="478" y="341.5" font-size="24" fill="#aab6cd" font-weight="400">SMTP 投递</text><rect x="48" y="375" width="804" height="236" rx="18" fill="#151c2b" stroke="#ffb65c" stroke-width="2"/><text x="78" y="423" font-size="34" fill="#ffb65c" font-weight="700">02  Cloudflare Email Routing</text><text x="78" y="469" font-size="27" fill="#e9edf7" font-weight="400">MX 指向 Cloudflare 的邮件服务器</text><text x="78" y="511" font-size="27" fill="#e9edf7" font-weight="400">匹配规则：claude@example.com</text><text x="78" y="553" font-size="27" fill="#e9edf7" font-weight="400">转发目标：your-name@gmail.com（已验证）</text><text x="78" y="595" font-size="27" fill="#e9edf7" font-weight="400">邮件经过认证检查与转发处理</text><path d="M450 611 V676" stroke="#8b9ab6" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="478" y="652.5" font-size="24" fill="#aab6cd" font-weight="400">转发至目标邮箱</text><rect x="48" y="686" width="804" height="236" rx="18" fill="#151c2b" stroke="#68dbd1" stroke-width="2"/><text x="78" y="734" font-size="34" fill="#68dbd1" font-weight="700">03  Gmail 接收与分类</text><text x="78" y="780" font-size="27" fill="#e9edf7" font-weight="400">邮件认证通过，也可能被分入垃圾邮件</text><text x="78" y="822" font-size="27" fill="#e9edf7" font-weight="400">过滤器同时匹配：发件域 + 域名收件地址</text><text x="78" y="864" font-size="27" fill="#e9edf7" font-weight="400">执行：不要将其发送至垃圾邮件</text><text x="78" y="906" font-size="27" fill="#e9edf7" font-weight="400">本次复测：新验证邮件直接进入收件箱</text><path d="M450 922 V987" stroke="#8b9ab6" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="478" y="963.5" font-size="24" fill="#aab6cd" font-weight="400">用户打开验证邮件</text><rect x="48" y="997" width="804" height="150" rx="18" fill="#151c2b" stroke="#b2df8a" stroke-width="2"/><text x="78" y="1045" font-size="34" fill="#b2df8a" font-weight="700">04  回到 Claude 继续验证</text><text x="78" y="1091" font-size="27" fill="#e9edf7" font-weight="400">使用邮件中的登录链接或验证码</text><text x="78" y="1133" font-size="27" fill="#e9edf7" font-weight="400">收到邮件 ≠ 新账号注册已经全部完成</text><text x="48" y="1202" font-size="25" fill="#aab6cd" font-weight="400">MX 决定交给谁  ·  路由决定转给谁  ·  Gmail 决定放哪里</text></g></svg>