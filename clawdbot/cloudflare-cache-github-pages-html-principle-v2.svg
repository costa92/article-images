<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1500" viewBox="0 0 900 1500"><defs><marker id="h-34D399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker><marker id="h-22D3EE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22D3EE"/></marker><marker id="h-A78BFA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker><marker id="h-E8ECF8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8ECF8"/></marker><marker id="h-FBBF24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FBBF24"/></marker><marker id="h-9AA4C0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA4C0"/></marker><marker id="h-F87171" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F87171"/></marker></defs><rect width="100%" height="100%" fill="#0B0E17"/><text x="450" y="70.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="40" font-weight="600" fill="#E8ECF8" text-anchor="middle">两层缓存：Cloudflare 清得掉边缘，</text><text x="450" y="124.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="40" font-weight="600" fill="#E8ECF8" text-anchor="middle">清不掉浏览器</text><rect x="40" y="180" width="820" height="300" rx="18" fill="#141A2B" stroke="#34D399" stroke-width="3"/><text x="80" y="240.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="600" fill="#34D399" text-anchor="start">访客浏览器</text><text x="80" y="300.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="28" font-weight="400" fill="#9AA4C0" text-anchor="start">cache-control: max-age=600</text><text x="80" y="350.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="400" fill="#E8ECF8" text-anchor="start">没过期就直接用本地副本，不发请求</text><rect x="80" y="385" width="740" height="70" rx="12" fill="#2A1620" stroke="#F87171" stroke-width="2" stroke-dasharray="8 6"/><text x="450" y="432.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="600" fill="#F87171" text-anchor="middle">Cloudflare 清缓存管不到这一层</text><path d="M450,480 L450,545" fill="none" stroke="#34D399" stroke-width="4" stroke-linejoin="round" marker-end="url(#h-34D399)"/><text x="475" y="522.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="400" fill="#34D399" text-anchor="start">请求</text><rect x="40" y="550" width="820" height="560" rx="18" fill="#141A2B" stroke="#22D3EE" stroke-width="3"/><text x="80" y="610.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="600" fill="#22D3EE" text-anchor="start">Cloudflare 边缘节点</text><rect x="80" y="645" width="740" height="90" rx="12" fill="#10172A" stroke="#9AA4C0" stroke-width="2"/><text x="105" y="701.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="400" fill="#E8ECF8" text-anchor="start">① CSS/JS 带 ?v=</text><text x="795" y="701.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="400" fill="#9AA4C0" text-anchor="end">边缘 1 年</text><rect x="80" y="750" width="740" height="90" rx="12" fill="#10172A" stroke="#9AA4C0" stroke-width="2"/><text x="105" y="806.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="400" fill="#E8ECF8" text-anchor="start">② /images/、/medias/</text><text x="795" y="806.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="400" fill="#9AA4C0" text-anchor="end">边缘 7 天</text><rect x="80" y="855" width="740" height="90" rx="12" fill="#10172A" stroke="#22D3EE" stroke-width="2"/><text x="105" y="911.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="400" fill="#E8ECF8" text-anchor="start">③ 以 / 结尾或 html/xml/json</text><text x="795" y="911.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="400" fill="#22D3EE" text-anchor="end">边缘 1 天</text><rect x="80" y="975" width="740" height="105" rx="12" fill="#2A2410" stroke="#FBBF24" stroke-width="2"/><text x="450" y="1018.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="32" font-weight="600" fill="#FBBF24" text-anchor="middle">部署后 purge_cache</text><text x="450" y="1060.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="400" fill="#FBBF24" text-anchor="middle">只清这一层</text><path d="M450,1110 L450,1175" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linejoin="round" marker-end="url(#h-22D3EE)"/><text x="475" y="1152.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="400" fill="#22D3EE" text-anchor="start">未命中才回源</text><rect x="40" y="1180" width="820" height="290" rx="18" fill="#141A2B" stroke="#A78BFA" stroke-width="3"/><text x="80" y="1240.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="600" fill="#A78BFA" text-anchor="start">GitHub Pages 源站</text><text x="80" y="1300.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="400" fill="#E8ECF8" text-anchor="start">推送后异步发布，约 1 分钟才换上新版本</text><text x="80" y="1360.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="30" font-weight="400" fill="#A78BFA" text-anchor="start">/build-id.txt</text><text x="80" y="1410.0" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="400" fill="#9AA4C0" text-anchor="start">每次构建一个新编号，用来判断是否已换新</text></svg>
