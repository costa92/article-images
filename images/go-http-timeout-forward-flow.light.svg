}text{font-family:"JetBrains Mono","Noto Sans SC","PingFang SC",sans-serif;}</style><defs><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-primary-stroke)"/></marker><marker id="arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-secondary-stroke)"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-stroke)"/></marker><marker id="arrow-alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-alert-stroke)"/></marker><marker id="arrow-highlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-highlight-stroke)"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40,0 L0,0 L0,40" fill="none" stroke="var(--bg-grid)" stroke-width="0.5"/></pattern></defs><rect width="100%" height="100%" fill="var(--bg)"/><rect width="100%" height="100%" fill="url(#grid)"/><path d="M400,260 L400,320" fill="none" stroke="var(--color-primary-stroke)" stroke-width="2.5" marker-end="url(#arrow-primary)"/><path d="M265,380 L210,380 L210,540" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="2.5" marker-end="url(#arrow-secondary)"/><path d="M535,380 L590,380 L590,540" fill="none" stroke="var(--color-alert-stroke)" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-alert)"/><path d="M210,650 L210,710" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="2.5" marker-end="url(#arrow-secondary)"/><path d="M210,820 L210,880" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="2.5" marker-end="url(#arrow-secondary)"/><path d="M210,990 L210,1060" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="2.5" marker-end="url(#arrow-secondary)"/><path d="M590,650 L590,710" fill="none" stroke="var(--color-alert-stroke)" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-alert)"/><path d="M590,820 L590,880" fill="none" stroke="var(--color-alert-stroke)" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-alert)"/><path d="M590,990 L590,1060" fill="none" stroke="var(--color-alert-stroke)" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-alert)"/><rect x="180.0" y="150" width="440" height="110" rx="28" fill="var(--mask)"/><rect x="180.0" y="150" width="440" height="110" rx="28" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="2"/><polygon points="400,320 535,380 400,440 265,380" fill="var(--mask)"/><polygon points="400,320 535,380 400,440 265,380" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="2"/><rect x="50.0" y="540" width="320" height="110" rx="12" fill="var(--mask)"/><rect x="50.0" y="540" width="320" height="110" rx="12" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="2"/><rect x="430.0" y="540" width="320" height="110" rx="12" fill="var(--mask)"/><rect x="430.0" y="540" width="320" height="110" rx="12" fill="var(--color-alert-fill)" stroke="var(--color-alert-stroke)" stroke-width="2"/><rect x="50.0" y="710" width="320" height="110" rx="12" fill="var(--mask)"/><rect x="50.0" y="710" width="320" height="110" rx="12" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="2"/><rect x="430.0" y="710" width="320" height="110" rx="12" fill="var(--mask)"/><rect x="430.0" y="710" width="320" height="110" rx="12" fill="var(--color-alert-fill)" stroke="var(--color-alert-stroke)" stroke-width="2"/><rect x="180.0" y="880" width="440" height="110" rx="28" fill="var(--mask)"/><rect x="180.0" y="880" width="440" height="110" rx="28" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="2"/><rect x="50.0" y="1060" width="320" height="110" rx="28" fill="var(--mask)"/><rect x="50.0" y="1060" width="320" height="110" rx="28" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="2"/><rect x="430.0" y="1060" width="320" height="110" rx="28" fill="var(--mask)"/><rect x="430.0" y="1060" width="320" height="110" rx="28" fill="var(--color-alert-fill)" stroke="var(--color-alert-stroke)" stroke-width="2"/><text x="400" y="60" text-anchor="middle" font-size="34" font-weight="700" fill="var(--text)">A 调 B：保留还是切断取消关系</text><text x="400" y="104" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">客户端预算 50ms · B 为协作取消的 gRPC 服务</text><text x="400" y="193" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">请求进入服务 A</text><text x="400" y="232" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">A 先处理 20ms</text><text x="400" y="390" text-anchor="middle" font-size="27" font-weight="600" fill="var(--text)">沿用入站 ctx？</text><text x="210" y="583" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">传入原请求 ctx</text><text x="210" y="622" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">backend.Run(ctx, req)</text><text x="590" y="583" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">改用 Background</text><text x="590" y="622" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">与父请求脱离</text><text x="210" y="753" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">保留取消传播</text><text x="210" y="792" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">有时限则传剩余预算</text><text x="590" y="753" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">B 无原请求时限</text><text x="590" y="792" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">也收不到原请求取消</text><text x="400" y="923" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">客户端 50ms 超时</text><text x="400" y="962" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">A 的请求 context 取消</text><text x="210" y="1103" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">B 响应取消退出</text><text x="210" y="1142" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">本次完成 2/20 步</text><text x="590" y="1103" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">B 继续执行</text><text x="590" y="1142" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">本次完成 20/20 步</text><text x="250" y="460" text-anchor="middle" font-size="28" font-weight="400" fill="var(--color-secondary-stroke)">是</text><text x="630" y="460" text-anchor="middle" font-size="28" font-weight="400" fill="var(--color-alert-stroke)">否</text><text x="400" y="1230" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">gRPC → A：B 收到剩余约 29.8ms，而非重置为 50ms</text><text x="400" y="1275" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">HTTP → A：没有数值 deadline，仍能沿原 ctx 传播取消</text></svg>
