<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120" role="img"><style>:root{--bg:#f7f9fc;--bg-grid:#d9e0ea;--mask:#f7f9fc;--shadow:#1e293b;--text:#111827;--text-muted:#4b5563;--arrow:#64748b;--color-primary-fill:#f3f7ff;--color-primary-stroke:#2563eb;--color-primary-border:#9db8f2;--color-secondary-fill:#f2fbf5;--color-secondary-stroke:#16a34a;--color-secondary-border:#94d3ab;--color-accent-fill:#fffaf0;--color-accent-stroke:#d97706;--color-accent-border:#f1c98a;--color-alert-fill:#fff5f5;--color-alert-stroke:#dc2626;--color-alert-border:#f2a7a7;--color-highlight-fill:#f3f7ff;--color-highlight-stroke:#2563eb;--color-highlight-border:#9db8f2;}text{font-family:'Noto Sans CJK SC', 'PingFang SC', 'Heiti SC', sans-serif;}</style><defs><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-primary-stroke)"/></marker><marker id="arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-secondary-stroke)"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-stroke)"/></marker><marker id="arrow-alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-alert-stroke)"/></marker><marker id="arrow-highlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-highlight-stroke)"/></marker><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="var(--shadow)" flood-opacity="0.08"/></filter><pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.65" fill="var(--bg-grid)"/></pattern></defs><rect width="100%" height="100%" fill="var(--bg)"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.7"/><path d="M400,260 L400,320" fill="none" stroke="var(--color-primary-stroke)" stroke-width="2.5" marker-end="url(#arrow-primary)"/><path d="M400,430 L400,490" fill="none" stroke="var(--color-primary-stroke)" stroke-width="2.5" marker-end="url(#arrow-primary)"/><path d="M265,550 L210,550 L210,700" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="2.5" marker-end="url(#arrow-secondary)"/><path d="M535,550 L590,550 L590,700" fill="none" stroke="var(--color-alert-stroke)" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-alert)"/><path d="M210,810 L210,870" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="2.5" marker-end="url(#arrow-secondary)"/><path d="M590,810 L590,870" fill="none" stroke="var(--color-alert-stroke)" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-alert)"/><rect x="180.0" y="150" width="440" height="110" rx="28" fill="var(--mask)"/><rect x="180.0" y="150" width="440" height="110" rx="28" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-border)" stroke-width="1.5" filter="url(#shadow)"/><rect x="180.0" y="320" width="440" height="110" rx="12" fill="var(--mask)"/><rect x="180.0" y="320" width="440" height="110" rx="12" fill="var(--color-primary-fill)" stroke="var(--color-primary-border)" stroke-width="1.5" filter="url(#shadow)"/><polygon points="400,490 535,550 400,610 265,550" fill="var(--mask)"/><polygon points="400,490 535,550 400,610 265,550" fill="var(--color-accent-fill)" stroke="var(--color-accent-border)" stroke-width="1.5"/><rect x="50.0" y="700" width="320" height="110" rx="12" fill="var(--mask)"/><rect x="50.0" y="700" width="320" height="110" rx="12" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-border)" stroke-width="1.5" filter="url(#shadow)"/><rect x="430.0" y="700" width="320" height="110" rx="12" fill="var(--mask)"/><rect x="430.0" y="700" width="320" height="110" rx="12" fill="var(--color-alert-fill)" stroke="var(--color-alert-border)" stroke-width="1.5" filter="url(#shadow)"/><rect x="50.0" y="870" width="320" height="110" rx="28" fill="var(--mask)"/><rect x="50.0" y="870" width="320" height="110" rx="28" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-border)" stroke-width="1.5" filter="url(#shadow)"/><rect x="430.0" y="870" width="320" height="110" rx="28" fill="var(--mask)"/><rect x="430.0" y="870" width="320" height="110" rx="28" fill="var(--color-alert-fill)" stroke="var(--color-alert-border)" stroke-width="1.5" filter="url(#shadow)"/><text x="400" y="60" text-anchor="middle" font-size="34" font-weight="700" fill="var(--text)">取消信号到达以后，工作才面临选择</text><text x="400" y="104" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">直连客户端超时 · 请求已进入业务函数</text><text x="400" y="193" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">客户端请求超时</text><text x="400" y="232" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">底层请求被取消</text><text x="400" y="363" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">服务端 context 取消</text><text x="400" y="402" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">不会强制终止业务代码</text><text x="400" y="560" text-anchor="middle" font-size="27" font-weight="600" fill="var(--text)">业务响应取消？</text><text x="210" y="743" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">检查点观察到取消</text><text x="210" y="782" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">ctx.Err() / ctx.Done()</text><text x="590" y="743" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">忽略取消信号</text><text x="590" y="782" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">循环继续执行</text><text x="210" y="913" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">业务提前退出</text><text x="210" y="952" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">剩余计算被放弃</text><text x="590" y="913" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">全部计算做完</text><text x="590" y="952" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">仍会消耗 CPU</text><text x="250" y="620" text-anchor="middle" font-size="28" font-weight="400" fill="var(--color-secondary-stroke)">是</text><text x="630" y="620" text-anchor="middle" font-size="28" font-weight="400" fill="var(--color-alert-stroke)">否</text><text x="400" y="1040" text-anchor="middle" font-size="28" font-weight="400" fill="var(--text)">客户端返回与业务退出，是两个时间点</text><text x="400" y="1080" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">仅停止本地等待的 wait-only 不会触发上面的请求取消</text></svg>
