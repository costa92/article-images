<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120" role="img"><style>:root {
    --bg: #f8fafc;
    --bg-grid: #e2e8f0;
    --mask: #f8fafc;
    --text: #0f172a;
    --text-muted: #475569;
    --arrow: #64748b;
    --color-primary-fill: rgba(6,182,212,0.12);
    --color-primary-stroke: #0891b2;
    --color-secondary-fill: rgba(5,150,105,0.12);
    --color-secondary-stroke: #059669;
    --color-tertiary-fill: rgba(124,58,237,0.12);
    --color-tertiary-stroke: #7c3aed;
    --color-accent-fill: rgba(217,119,6,0.12);
    --color-accent-stroke: #d97706;
    --color-alert-fill: rgba(225,29,72,0.12);
    --color-alert-stroke: #e11d48;
    --color-connector-fill: rgba(234,88,12,0.12);
    --color-connector-stroke: #ea580c;
    --color-neutral-fill: rgba(100,116,139,0.12);
    --color-neutral-stroke: #64748b;
    --color-highlight-fill: rgba(59,130,246,0.12);
    --color-highlight-stroke: #3b82f6;
}text{font-family:"JetBrains Mono","Noto Sans SC","PingFang SC",sans-serif;}</style><defs><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-primary-stroke)"/></marker><marker id="arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-secondary-stroke)"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-stroke)"/></marker><marker id="arrow-alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-alert-stroke)"/></marker><marker id="arrow-highlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-highlight-stroke)"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40,0 L0,0 L0,40" fill="none" stroke="var(--bg-grid)" stroke-width="0.5"/></pattern></defs><rect width="100%" height="100%" fill="var(--bg)"/><rect width="100%" height="100%" fill="url(#grid)"/><path d="M400,260 L400,320" fill="none" stroke="var(--color-primary-stroke)" stroke-width="2.5" marker-end="url(#arrow-primary)"/><path d="M400,430 L400,490" fill="none" stroke="var(--color-primary-stroke)" stroke-width="2.5" marker-end="url(#arrow-primary)"/><path d="M265,550 L210,550 L210,700" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="2.5" marker-end="url(#arrow-secondary)"/><path d="M535,550 L590,550 L590,700" fill="none" stroke="var(--color-alert-stroke)" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-alert)"/><path d="M210,810 L210,870" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="2.5" marker-end="url(#arrow-secondary)"/><path d="M590,810 L590,870" fill="none" stroke="var(--color-alert-stroke)" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-alert)"/><rect x="180.0" y="150" width="440" height="110" rx="28" fill="var(--mask)"/><rect x="180.0" y="150" width="440" height="110" rx="28" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="2"/><rect x="180.0" y="320" width="440" height="110" rx="12" fill="var(--mask)"/><rect x="180.0" y="320" width="440" height="110" rx="12" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="2"/><polygon points="400,490 535,550 400,610 265,550" fill="var(--mask)"/><polygon points="400,490 535,550 400,610 265,550" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="2"/><rect x="50.0" y="700" width="320" height="110" rx="12" fill="var(--mask)"/><rect x="50.0" y="700" width="320" height="110" rx="12" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="2"/><rect x="430.0" y="700" width="320" height="110" rx="12" fill="var(--mask)"/><rect x="430.0" y="700" width="320" height="110" rx="12" fill="var(--color-alert-fill)" stroke="var(--color-alert-stroke)" stroke-width="2"/><rect x="50.0" y="870" width="320" height="110" rx="28" fill="var(--mask)"/><rect x="50.0" y="870" width="320" height="110" rx="28" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="2"/><rect x="430.0" y="870" width="320" height="110" rx="28" fill="var(--mask)"/><rect x="430.0" y="870" width="320" height="110" rx="28" fill="var(--color-alert-fill)" stroke="var(--color-alert-stroke)" stroke-width="2"/><text x="400" y="60" text-anchor="middle" font-size="34" font-weight="700" fill="var(--text)">取消信号到达以后，工作才面临选择</text><text x="400" y="104" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">直连客户端超时 · 请求已进入业务函数</text><text x="400" y="193" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">客户端请求超时</text><text x="400" y="232" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">底层请求被取消</text><text x="400" y="363" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">服务端 context 取消</text><text x="400" y="402" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">不会强制终止业务代码</text><text x="400" y="560" text-anchor="middle" font-size="27" font-weight="600" fill="var(--text)">业务响应取消？</text><text x="210" y="743" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">检查点观察到取消</text><text x="210" y="782" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">ctx.Err() / ctx.Done()</text><text x="590" y="743" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">忽略取消信号</text><text x="590" y="782" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">循环继续执行</text><text x="210" y="913" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">业务提前退出</text><text x="210" y="952" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">剩余计算被放弃</text><text x="590" y="913" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">全部计算做完</text><text x="590" y="952" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">仍会消耗 CPU</text><text x="250" y="620" text-anchor="middle" font-size="28" font-weight="400" fill="var(--color-secondary-stroke)">是</text><text x="630" y="620" text-anchor="middle" font-size="28" font-weight="400" fill="var(--color-alert-stroke)">否</text><text x="400" y="1040" text-anchor="middle" font-size="28" font-weight="400" fill="var(--text)">客户端返回与业务退出，是两个时间点</text><text x="400" y="1080" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">仅停止本地等待的 wait-only 不会触发上面的请求取消</text></svg>
