<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1430" viewBox="0 0 800 1430" role="img"><style>:root{--bg:#f7f9fc;--bg-grid:#d9e0ea;--mask:#f7f9fc;--shadow:#1e293b;--text:#111827;--text-muted:#4b5563;--arrow:#64748b;--color-primary-fill:#f3f7ff;--color-primary-stroke:#2563eb;--color-primary-border:#9db8f2;--color-secondary-fill:#f2fbf5;--color-secondary-stroke:#16a34a;--color-secondary-border:#94d3ab;--color-accent-fill:#fffaf0;--color-accent-stroke:#d97706;--color-accent-border:#f1c98a;--color-alert-fill:#fff5f5;--color-alert-stroke:#dc2626;--color-alert-border:#f2a7a7;--color-highlight-fill:#f3f7ff;--color-highlight-stroke:#2563eb;--color-highlight-border:#9db8f2;}text{font-family:'Noto Sans CJK SC', 'PingFang SC', 'Heiti SC', sans-serif;}</style><defs><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-primary-stroke)"/></marker><marker id="arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-secondary-stroke)"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-stroke)"/></marker><marker id="arrow-alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-alert-stroke)"/></marker><marker id="arrow-highlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-highlight-stroke)"/></marker><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="var(--shadow)" flood-opacity="0.08"/></filter><pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.65" fill="var(--bg-grid)"/></pattern></defs><rect width="100%" height="100%" fill="var(--bg)"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.7"/><path d="M400,260 L400,320" fill="none" stroke="var(--color-primary-stroke)" stroke-width="2.5" marker-end="url(#arrow-primary)"/><path d="M400,430 L400,470 L210,470 L210,520" fill="none" stroke="var(--color-primary-stroke)" stroke-width="2.5" marker-end="url(#arrow-primary)"/><path d="M400,470 L590,470 L590,520" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="2.5" marker-end="url(#arrow-secondary)"/><path d="M210,630 L210,690" fill="none" stroke="var(--color-primary-stroke)" stroke-width="2.5" marker-end="url(#arrow-primary)"/><path d="M590,630 L590,690" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="2.5" marker-end="url(#arrow-secondary)"/><path d="M590,810 L590,930" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="2.5" marker-end="url(#arrow-secondary)"/><path d="M455,750 L400,750 L400,875 L210,875 L210,930" fill="none" stroke="var(--color-accent-stroke)" stroke-width="2.5" marker-end="url(#arrow-accent)"/><path d="M210,1040 L210,1090 L400,1090 L400,1130" fill="none" stroke="var(--color-accent-stroke)" stroke-width="2.5" marker-end="url(#arrow-accent)"/><path d="M590,1040 L590,1090 L400,1090" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="2.5" marker-end="url(#arrow-secondary)"/><rect x="160.0" y="150" width="480" height="110" rx="12" fill="var(--mask)"/><rect x="160.0" y="150" width="480" height="110" rx="12" fill="var(--color-primary-fill)" stroke="var(--color-primary-border)" stroke-width="1.5" filter="url(#shadow)"/><rect x="160.0" y="320" width="480" height="110" rx="12" fill="var(--mask)"/><rect x="160.0" y="320" width="480" height="110" rx="12" fill="var(--color-primary-fill)" stroke="var(--color-primary-border)" stroke-width="1.5" filter="url(#shadow)"/><rect x="50.0" y="520" width="320" height="110" rx="12" fill="var(--mask)"/><rect x="50.0" y="520" width="320" height="110" rx="12" fill="var(--color-primary-fill)" stroke="var(--color-primary-border)" stroke-width="1.5" filter="url(#shadow)"/><rect x="430.0" y="520" width="320" height="110" rx="12" fill="var(--mask)"/><rect x="430.0" y="520" width="320" height="110" rx="12" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-border)" stroke-width="1.5" filter="url(#shadow)"/><rect x="50.0" y="690" width="320" height="110" rx="28" fill="var(--mask)"/><rect x="50.0" y="690" width="320" height="110" rx="28" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-border)" stroke-width="1.5" filter="url(#shadow)"/><polygon points="590,690 725,750 590,810 455,750" fill="var(--mask)"/><polygon points="590,690 725,750 590,810 455,750" fill="var(--color-accent-fill)" stroke="var(--color-accent-border)" stroke-width="1.5"/><rect x="430.0" y="930" width="320" height="110" rx="28" fill="var(--mask)"/><rect x="430.0" y="930" width="320" height="110" rx="28" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-border)" stroke-width="1.5" filter="url(#shadow)"/><rect x="50.0" y="930" width="320" height="110" rx="28" fill="var(--mask)"/><rect x="50.0" y="930" width="320" height="110" rx="28" fill="var(--color-accent-fill)" stroke="var(--color-accent-border)" stroke-width="1.5" filter="url(#shadow)"/><rect x="160.0" y="1130" width="480" height="110" rx="12" fill="var(--mask)"/><rect x="160.0" y="1130" width="480" height="110" rx="12" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-border)" stroke-width="1.5" filter="url(#shadow)"/><text x="400" y="60" text-anchor="middle" font-size="34" font-weight="700" fill="var(--text)">独立任务：请求结束后，由自己的时限约束</text><text x="400" y="104" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">detached 模式 · 进程内任务，不提供重启恢复</text><text x="400" y="193" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">创建独立任务 ctx</text><text x="400" y="232" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">WithoutCancel(requestCtx)</text><text x="400" y="363" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">设置独立超时</text><text x="400" y="402" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">WithTimeout(..., ownBudget)</text><text x="210" y="563" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">请求仍用原 ctx</text><text x="210" y="602" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">监听 requestCtx.Done()</text><text x="590" y="563" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">启动任务 goroutine</text><text x="590" y="602" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">work(taskCtx)</text><text x="210" y="733" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">客户端取消请求</text><text x="210" y="772" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">handler 可以提前返回</text><text x="590" y="760" text-anchor="middle" font-size="27" font-weight="600" fill="var(--text)">工作先完成？</text><text x="590" y="973" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">记录成功结果</text><text x="590" y="1012" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">完成全部工作</text><text x="210" y="973" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">独立时限先到</text><text x="210" y="1012" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">任务响应取消退出</text><text x="400" y="1173" text-anchor="middle" font-size="28" font-weight="600" fill="var(--text)">登记结果并释放资源</text><text x="400" y="1212" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">任务内部 defer taskCancel()</text><text x="630" y="875" text-anchor="middle" font-size="28" font-weight="400" fill="var(--color-secondary-stroke)">是</text><text x="350" y="860" text-anchor="middle" font-size="28" font-weight="400" fill="var(--color-accent-stroke)">否</text><text x="400" y="1310" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">父请求取消不会取消 taskCtx；任务仍需响应自己的取消</text><text x="400" y="1350" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">本次 ownBudget=80ms：完成 7 步后 DeadlineExceeded</text><text x="400" y="1390" text-anchor="middle" font-size="23" font-weight="400" fill="var(--text-muted)">示例驱动最终等待任务结束；不在 handler 返回时释放任务 ctx</text></svg>
