<rect x="40" y="336" width="390" height="92" rx="12" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="2"/>
<rect x="40" y="472" width="390" height="92" rx="12" fill="var(--mask)"/>
<rect x="40" y="472" width="390" height="92" rx="12" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="2"/>
