<rect x="40" y="1016" width="390" height="92" rx="12" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="2"/>
<rect x="470" y="200" width="390" height="92" rx="12" fill="var(--mask)"/>
<rect x="470" y="200" width="390" height="92" rx="12" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="2"/>
<rect x="470" y="336" width="390" height="92" rx="12" fill="var(--mask)"/>
<rect x="470" y="336" width="390" height="92" rx="12" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="2"/>
<rect x="470" y="472" width="390" height="92" rx="12" fill="var(--mask)"/>
