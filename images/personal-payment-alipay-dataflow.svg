<rect x="40" y="608" width="390" height="92" rx="12" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="2"/>
<rect x="40" y="744" width="390" height="92" rx="12" fill="var(--mask)"/>
<rect x="40" y="744" width="390" height="92" rx="12" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="2"/>
<rect x="40" y="880" width="390" height="92" rx="12" fill="var(--mask)"/>
<rect x="40" y="880" width="390" height="92" rx="12" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="2"/>
