<rect x="470" y="1016" width="390" height="92" rx="12" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="2"/>
<text x="235" y="158" font-size="27" fill="var(--color-accent-stroke)" font-weight="700" text-anchor="middle">套件直连</text>
<text x="665" y="158" font-size="27" fill="var(--color-secondary-stroke)" font-weight="700" text-anchor="middle">基础收款</text>
<text x="235.0" y="237" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">01  确定账号与可售档位</text>
<text x="235.0" y="267" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">业务用户 ID + 商品 + sku_id</text>
<text x="235.0" y="373" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">02  获取托管购买入口</text>
<text x="235.0" y="403" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">purchase.create → 链接 / 二维码</text>
<text x="235.0" y="509" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">03  用户在支付宝付款</text>
<text x="235.0" y="539" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">托管购买页承接确认与支付</text>
<text x="235.0" y="645" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">04  套件发放购买额度</text>
<text x="235.0" y="675" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">支付结果 → 套件权益记录</text>
<text x="235.0" y="781" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">05  服务端刷新剩余次数</text>
<text x="235.0" y="811" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">quota.query → remaining</text>
<text x="235.0" y="917" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">06  使用时正式核销</text>
<text x="235.0" y="947" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">quota.verify → 消费状态</text>
<text x="235.0" y="1053" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">07  记录服务交付结果</text>
<text x="235.0" y="1083" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">业务任务 ↔ 原消费请求号</text>
<text x="665.0" y="237" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">01  服务端读取套餐</text>
<text x="665.0" y="267" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">价格 1200 分 + 权益 30 次</text>
<text x="665.0" y="373" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">02  保存待支付订单</text>
<text x="665.0" y="403" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">订单号 + 用户 + 商品快照</text>
<text x="665.0" y="509" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">03  页面下单并付款</text>
<text x="665.0" y="539" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">page.pay → 支付宝收银台</text>
<text x="665.0" y="645" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">04  服务端确认支付</text>
<text x="665.0" y="675" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">异步通知 / trade.query</text>
<text x="665.0" y="781" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">05  验签并核对原订单</text>
<text x="665.0" y="811" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">应用 · 收款方 · 金额 · 状态</text>
<text x="665.0" y="917" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">06  业务事务发放权益</text>
<text x="665.0" y="947" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">支付记录 + 流水 + 30 次余额</text>
<text x="665.0" y="1053" font-size="23" fill="var(--text)" font-weight="700" text-anchor="middle">07  页面查询本地订单</text>
<text x="665.0" y="1083" font-size="18" fill="var(--text-muted)" font-weight="400" text-anchor="middle">已发放 → 用户获得可用次数</text>
<text x="40" y="1186" font-size="20" fill="var(--text-muted)" font-weight="400" text-anchor="start">套件消费结果未知：按原请求号查询恢复，不换号重复扣次。</text>
<text x="40" y="1220" font-size="20" fill="var(--text-muted)" font-weight="400" text-anchor="start">基础收款通知与补单：共用同一事务发放逻辑，同笔支付只发一次。</text>
<text x="40" y="1254" font-size="17" fill="var(--text-muted)" font-weight="400" text-anchor="start">预期数据流程 · 次数包示例 · 页面返回本身不授予权益</text>
<text x="40" y="66" font-size="32" fill="var(--text)" font-weight="700" text-anchor="start">支付宝：购买与权益数据怎样流转</text>
<text x="40" y="105" font-size="19" fill="var(--text-muted)" font-weight="400" text-anchor="start">同一笔购买，因接入模式不同，权益写入的位置也不同</text>
</svg>