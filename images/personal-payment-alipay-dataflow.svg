<path d="M 665,972 L 665,1016" fill="none" stroke="var(--arrow)" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="200" width="390" height="92" rx="12" fill="var(--mask)"/>
<rect x="40" y="200" width="390" height="92" rx="12" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="2"/>
