<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1660" viewBox="0 0 800 1660" role="img"><style>:root{--bg:#0f172a;--bg-grid:#1e293b;--mask:#0f172a;--text:#ffffff;--text-muted:#94a3b8;--arrow:#64748b;--color-primary-fill:rgba(8,51,68,0.4);--color-primary-stroke:#22d3ee;--color-secondary-fill:rgba(6,78,59,0.4);--color-secondary-stroke:#34d399;--color-tertiary-fill:rgba(76,29,149,0.4);--color-tertiary-stroke:#a78bfa;--color-accent-fill:rgba(120,53,15,0.3);--color-accent-stroke:#fbbf24;--color-alert-fill:rgba(136,19,55,0.4);--color-alert-stroke:#fb7185;--color-highlight-fill:rgba(59,130,246,0.3);--color-highlight-stroke:#60a5fa;}text{font-family:"JetBrains Mono","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;}</style><defs><marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-primary-stroke)"/></marker><marker id="arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-secondary-stroke)"/></marker><marker id="arrow-tertiary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-tertiary-stroke)"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-accent-stroke)"/></marker><marker id="arrow-alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-alert-stroke)"/></marker><marker id="arrow-highlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--color-highlight-stroke)"/></marker><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40,0 L0,0 L0,40" fill="none" stroke="var(--bg-grid)" stroke-width="0.5"/></pattern></defs><rect width="100%" height="100%" fill="var(--bg)"/><rect width="100%" height="100%" fill="url(#grid)"/><path d="M400,262 L400,322" fill="none" stroke="var(--color-primary-stroke)" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-primary)"/><path d="M400,434 L400,494" fill="none" stroke="var(--color-primary-stroke)" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-primary)"/><path d="M400,864 L400,924" fill="none" stroke="var(--color-primary-stroke)" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-primary)"/><path d="M400,1036 L400,1096" fill="none" stroke="var(--color-primary-stroke)" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-primary)"/><path d="M400,1224 L400,1284" fill="none" stroke="var(--color-primary-stroke)" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-primary)"/><path d="M400,1396 L400,1456" fill="none" stroke="var(--color-primary-stroke)" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-primary)"/><path d="M400,606 L400,630 L710,630 L710,808 L620,808" fill="none" stroke="var(--color-accent-stroke)" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-accent)"/><path d="M275,1160 L70,1160 L70,550 L180,550" fill="none" stroke="var(--color-alert-stroke)" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow-alert)"/><rect x="180" y="150" width="440" height="112" rx="14" fill="var(--mask)"/><rect x="180" y="150" width="440" height="112" rx="14" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="2.5"/><rect x="180" y="322" width="440" height="112" rx="14" fill="var(--mask)"/><rect x="180" y="322" width="440" height="112" rx="14" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="2.5"/><rect x="180" y="494" width="440" height="112" rx="30" fill="var(--mask)"/><rect x="180" y="494" width="440" height="112" rx="30" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="2.5"/><rect x="180" y="752" width="440" height="112" rx="14" fill="var(--mask)"/><rect x="180" y="752" width="440" height="112" rx="14" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="2.5"/><rect x="180" y="924" width="440" height="112" rx="14" fill="var(--mask)"/><rect x="180" y="924" width="440" height="112" rx="14" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="2.5"/><polygon points="400,1096 525,1160 400,1224 275,1160" fill="var(--mask)"/><polygon points="400,1096 525,1160 400,1224 275,1160" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="2.5"/><rect x="180" y="1284" width="440" height="112" rx="14" fill="var(--mask)"/><rect x="180" y="1284" width="440" height="112" rx="14" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="2.5"/><rect x="180" y="1456" width="440" height="112" rx="30" fill="var(--mask)"/><rect x="180" y="1456" width="440" height="112" rx="30" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="2.5"/><text x="400" y="64" text-anchor="middle" font-size="38" font-weight="700" fill="var(--text)">人工审批怎样暂停与恢复</text><text x="400" y="108" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">节点前审批 · 同存储与图版本 · 2026-11-15</text><text x="400" y="192" text-anchor="middle" font-size="32" font-weight="600" fill="var(--text)">查询订单并核对规则</text><text x="400" y="232" text-anchor="middle" font-size="26" font-weight="400" fill="var(--text-muted)">将可信业务事实写入状态</text><text x="400" y="364" text-anchor="middle" font-size="32" font-weight="600" fill="var(--text)">到达人工审查节点</text><text x="400" y="404" text-anchor="middle" font-size="26" font-weight="400" fill="var(--text-muted)">保存检查点与当前等待键</text><text x="400" y="536" text-anchor="middle" font-size="32" font-weight="600" fill="var(--text)">返回等待，结束本次调用</text><text x="400" y="576" text-anchor="middle" font-size="26" font-weight="400" fill="var(--text-muted)">Waiting=true / Done=false</text><text x="400" y="794" text-anchor="middle" font-size="32" font-weight="600" fill="var(--text)">宿主接收人工审批请求</text><text x="400" y="834" text-anchor="middle" font-size="26" font-weight="400" fill="var(--text-muted)">认证身份 · RunID + Key + 输入</text><text x="400" y="966" text-anchor="middle" font-size="32" font-weight="600" fill="var(--text)">Resume 校验与复核</text><text x="400" y="1006" text-anchor="middle" font-size="26" font-weight="400" fill="var(--text-muted)">输入 · 当前等待键 · 业务权限</text><text x="400" y="1171" text-anchor="middle" font-size="30" font-weight="600" fill="var(--text)">是否有效？</text><text x="400" y="1326" text-anchor="middle" font-size="32" font-weight="600" fill="var(--text)">保存人工修改与放行标记</text><text x="400" y="1366" text-anchor="middle" font-size="26" font-weight="400" fill="var(--text-muted)">同一次原子保存</text><text x="400" y="1498" text-anchor="middle" font-size="32" font-weight="600" fill="var(--text)">执行审查节点及后续分支</text><text x="400" y="1538" text-anchor="middle" font-size="26" font-weight="400" fill="var(--text-muted)">通过：退款 / 拒绝：记录原因</text><text x="400" y="666" text-anchor="middle" font-size="28" font-weight="400" fill="var(--color-accent-stroke)">可跨进程、稍后回应</text><text x="400" y="707" text-anchor="middle" font-size="26" font-weight="400" fill="var(--text-muted)">宿主负责通知与触发续跑</text><text x="430" y="1262" text-anchor="middle" font-size="28" font-weight="400" fill="var(--color-secondary-stroke)">是</text><text x="166" y="1135" text-anchor="middle" font-size="26" font-weight="400" fill="var(--color-alert-stroke)">否：仍等待</text><text x="514" y="1436" text-anchor="middle" font-size="26" font-weight="400" fill="var(--color-secondary-stroke)">保存成功</text><text x="400" y="1612" text-anchor="middle" font-size="24" font-weight="400" fill="var(--text-muted)">存储与节点故障未展开；支付幂等由业务接入</text></svg>
